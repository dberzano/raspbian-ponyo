---
- name: Assign hostname
  hostname: name="{{ assigned_hostname }}"

- name: Remove systemd DNS stub listener
  lineinfile:
    path: /etc/systemd/resolved.conf
    line: "DNSStubListener=no"
  notify:
    - Restart systemd-resolved

- name: Configure dnsmasq hosts
  copy: src=dnsmasq.hosts dest=/etc/dnsmasq.hosts
  notify:
    - Restart dnsmasq

- name: Configure dnsmasq
  template: src=dnsmasq.conf.j2 dest=/etc/dnsmasq.conf
  notify:
    - Restart dnsmasq

- name: Stop vpnbox-telegram to allow netplan configuration to be applied
  systemd:
    name: vpnbox-telegram
    state: stopped
  ignore_errors: yes
  tags:
    - wifi

- name: Unmount /etc/netplan to allow netplan configuration to be applied
  mount:
    state: unmounted
    path: /etc/netplan
  ignore_errors: yes
  tags:
    - wifi

- name: Add netplan configuration
  template: src=routerino.yaml.j2 dest=/etc/netplan/routerino.yaml mode=0600
  notify:
    - Apply netplan configuration
  tags:
    - wifi

- name: Add netplan configuration (original with all networks)
  template: src=routerino.yaml.j2 dest=/etc/netplan/routerino.yaml_all_networks mode=0600
  tags:
    - wifi

- name: Create DHCP server override directory
  file: path=/etc/systemd/system/isc-dhcp-server.service.d state=directory mode=0755

- name: Create systemd-networkd override directory
  file: path=/etc/systemd/networkd.conf.d state=directory mode=0755

- name: Tell systemd-networkd to not remove foreign routing policy rules
  copy:
    content: |
      [Network]
      ManageForeignRoutingPolicyRules=no
    dest: /etc/systemd/networkd.conf.d/keep-foreign-rules.conf
    mode: "0644"
  notify:
    - Restart systemd-networkd

- name: Add DHCP server configuration
  template: src=dhcpd.conf.j2 dest=/etc/dhcp/dhcpd.conf mode=0644
  notify:
    - Restart DHCP server

- name: Tell DHCP server to restart continuously
  copy: src=isc-dhcp-server-override.conf dest=/etc/systemd/system/isc-dhcp-server.service.d/override.conf
  notify:
    - Restart DHCP server

- name: Determine expected VPN box script names
  set_fact:
    expected_vpnbox_script_names: >-
      {{
        (vpn | dict2items | map(attribute='key') | map('regex_replace', '^', 'vpnbox-') | list)
        + (vpn_wg | dict2items | map(attribute='key') | map('regex_replace', '^', 'vpnbox-wg-') | list)
      }}

- name: Find existing VPN box scripts
  find:
    paths: /usr/local/sbin
    patterns: vpnbox-*
    file_type: file
  register: existing_vpnbox_scripts

- name: Remove stale VPN box scripts
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ existing_vpnbox_scripts.files }}"
  when: (item.path | basename) not in expected_vpnbox_script_names
  register: removed_vpnbox_scripts

- name: Add vpnbox script
  template:
    src: vpnbox.sh.j2
    dest: /usr/local/sbin/vpnbox-{{item.key}}
    mode: "0700"
  loop: "{{ vpn | dict2items }}"
  register: openvpn_scripts

- name: Add vpnbox-wg script
  template:
    src: vpnbox-wireguard.sh.j2
    dest: /usr/local/sbin/vpnbox-wg-{{item.key}}
    mode: "0700"
  loop: "{{ vpn_wg | dict2items }}"
  register: wireguard_scripts

- name: Refresh Telegram menu after VPN box scripts change
  systemd:
    name: vpnbox-telegram
    state: restarted
  when: openvpn_scripts.changed or wireguard_scripts.changed or removed_vpnbox_scripts.changed

- meta: flush_handlers
